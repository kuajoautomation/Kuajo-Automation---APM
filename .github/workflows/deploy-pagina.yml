# Publica la página (carpeta web/) en GitHub Pages con cada push a main.
# Cualquier cambio del repositorio redespliega: la página, el informe, el Excel o las figuras,
# porque la compilación copia esos archivos desde las carpetas de módulos (informes/, 01_proceso/ … 05_pm4r/).
name: Publicar la página en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SITE: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Copia informe, Excel y figuras desde las carpetas del proyecto y regenera los datos del Excel
      - run: node scripts/copy-assets.mjs && node scripts/sync-excel.mjs
      # Detiene la publicación si una cifra del sitio ya no coincide con el Excel
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
